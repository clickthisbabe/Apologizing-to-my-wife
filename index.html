<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Beautiful Bryelle ❤️</title>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e7,#fff0f6);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
padding:30px;
}

h1{
color:#ff4d88;
font-size:45px;
}

p{
font-size:22px;
color:#555;
}

button{
margin-top:30px;
padding:15px 35px;
font-size:20px;
background:#ff4d88;
color:white;
border:none;
border-radius:50px;
cursor:pointer;
}

button:hover{
transform:scale(1.08);
}

.heart{
position:absolute;
font-size:25px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-100vh);
opacity:1;
}
}

</style>

</head>

<body>

<div class="container">

<h1>💖 For My Beautiful Bryelle 💖</h1>

<p>
I made something special just for you...
</p>

<button onclick="window.location.href='apology.html'">
Open My Heart ❤️
</button>

</div>

<script>

for(let i=0;i<30;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(heart);

}

</script>

</body>
</html>
