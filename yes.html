<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>I Love You ❤️</title>

<style>
body{
margin:0;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#ffd6e7,#fff);
font-family:Arial,sans-serif;
overflow:hidden;
text-align:center;
}

.box{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 0 25px pink;
max-width:700px;
}

h1{
color:#ff4d88;
font-size:42px;
}

p{
font-size:22px;
line-height:1.8;
color:#555;
}

.heart{
position:fixed;
font-size:25px;
animation:fall 5s linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-100px);
opacity:1;
}
100%{
transform:translateY(100vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="box">

<h1>Thank You ❤️</h1>

<p>

Thank you for giving me another chance.

I love you more than words can explain.

You are my favorite person, my peace, and my happiness.

I promise to keep choosing you every single day.

💖

Forever yours,

<b>Moreey ❤️</b>

</p>

</div>

<script>
for(let i=0;i<60;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="💖";
h.style.left=Math.random()*100+"vw";
h.style.animationDelay=Math.random()*5+"s";
document.body.appendChild(h);
}
</script>

</body>
</html>
