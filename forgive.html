<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Will You Forgive Me?</title>

<style>
body{
font-family:Arial;
background:#ffe6f2;
text-align:center;
padding-top:80px;
overflow:hidden;
}

h1{
color:#ff4d88;
font-size:45px;
}

button{
padding:15px 35px;
font-size:22px;
border:none;
border-radius:40px;
margin:20px;
cursor:pointer;
}

#yes{
background:#ff4d88;
color:white;
}

#no{
background:#888;
color:white;
position:absolute;
}
</style>
</head>

<body>

<h1>Will You Forgive Me? ❤️🥹</h1>

<button id="yes" onclick="window.location.href='yes.html'">
YES ❤️
</button>

<button id="no">
NO 😒
</button>

<script>

let tries=0;

const no=document.getElementById("no");

no.addEventListener("mouseover",move);

no.addEventListener("click",move);

function move(){

tries++;

if(tries>=3){

window.location.href="yourmama.html";

return;

}

no.style.left=Math.random()*70+"%";
no.style.top=Math.random()*70+"%";

}

</script>

</body>
</html>
